version: '3.8'

services:
  postgres:
    image: postgres:13-alpine
    container_name: lora-postgres
    env_file:
      - db.env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lora-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gsmloraserver_app
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-lora_db}
    network_mode: host
    extra_hosts:
      - "postgres:127.0.0.1"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  lora-network:
    driver: bridge
